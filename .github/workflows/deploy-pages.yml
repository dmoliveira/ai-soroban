name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency baseline
        run: npm run audit:dependencies

      - name: Validate project
        run: |
          npm run check
          npm run test:release
          npm test

      - name: Build site
        run: npm run build

      - name: Verify built content routes
        run: npm run test:content-build

      - name: Verify built theme bootstrap
        run: npm run test:theme-build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production theme first paint
        run: npm run test:e2e:theme-preview

      - name: Validate browser flows
        run: PLAYWRIGHT_SERVER_MODE=preview npm run test:e2e

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release-smoke:
    name: Verify deployed release
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.page_url != '' }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke deployed release
        run: npm run test:e2e:release-smoke
